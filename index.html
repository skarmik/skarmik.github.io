<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pokédex</title>
    <meta
      name="description"
      content="Pokédex: lista de Pokémon de la A a la Z, con soporte offline."
    />
    <meta name="theme-color" content="#e3350d" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Pokédex" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-interna">
        <img class="logo" src="icons/icon-96.png" alt="" />
        <h1>Pokédex</h1>

        <div class="buscador">
          <svg class="icono-buscar" viewBox="0 0 24 24" aria-hidden="true">
            <circle
              cx="11"
              cy="11"
              r="7"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <line
              x1="16.5"
              y1="16.5"
              x2="21"
              y2="21"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <input
            id="buscador"
            type="search"
            placeholder="Buscar Pokémon"
            autocomplete="off"
            spellcheck="false"
            aria-label="Buscar Pokémon por nombre"
          />
          <button
            id="btn-limpiar"
            class="btn-limpiar"
            type="button"
            aria-label="Limpiar búsqueda"
            hidden
          >
            &times;
          </button>
        </div>
      </div>
    </header>

    <main>
      <p id="estado" class="estado" role="status">Cargando lista de Pokémon…</p>
      <ul id="lista" class="lista" aria-live="polite"></ul>

      <div id="sentinela" class="sentinela" aria-hidden="true"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
